[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-agent-security-framework"
version = "0.1.0"
description = "A framework for behavioural monitoring and anomaly detection in autonomous AI agents."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"